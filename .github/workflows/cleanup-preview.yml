name: Cleanup Netlify Preview

on:
  pull_request:
    types: [closed]

jobs:
  cleanup-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Netlify deploy previews for this PR's branch
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          BRANCH: ${{ github.head_ref }}
        run: |
          DEPLOY_IDS=$(curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys?branch=$BRANCH" \
            | jq -r '.[].id')
          for id in $DEPLOY_IDS; do
            echo "Deleting deploy $id"
            curl -s -X DELETE -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/deploys/$id"
          done
